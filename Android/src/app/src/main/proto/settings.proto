syntax = "proto3";

package com.google.ai.edge.gallery.proto;

option java_package = "com.google.ai.edge.gallery.proto";
option java_multiple_files = true;

enum Theme {
  THEME_UNSPECIFIED = 0;

  // Force to use light theme.
  THEME_LIGHT = 1;

  // Force to use dark theme.
  THEME_DARK = 2;

  // Use the system them setting on user's phone.
  THEME_AUTO = 3;
}

message AccessTokenData {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at_ms = 3;
}

message ImportedModel {
  string file_name = 1;
  int64 file_size = 2;

  oneof config {
    LlmConfig llm_config = 3;
  }
}

message LlmConfig {
  repeated string compatible_accelerators = 1;
  int32 default_max_tokens = 2;
  int32 default_topk = 3;
  float default_topp = 4;
  float default_temperature = 5;
  bool support_image = 6;
  bool support_audio = 7;
  // Fields 8-9 reserved (removed: support_tiny_garden, support_mobile_actions)
  reserved 8, 9;
}

message EchoSenseSettings {
  bool video_preview_enabled = 1;
  bool text_overlay_enabled = 2;
  // "concise" or "verbose"
  string llm_response_style = 3;
  // Deprecated plaintext credential. Migrated to Android Keystore-backed storage.
  string gemini_api_key = 4;
  bool show_debug_overlay = 5;
  string tts_voice_name = 6;
  // "gemini" or "openai"
  string online_provider = 7;
  // "ask", "fallback", or "prefer_online"
  string online_usage_mode = 8;
  bool online_consent_granted = 9;
  // Multiplier applied only to collision-avoidance speech.
  float safety_speech_rate = 10;
}

message Settings {
  Theme theme = 1;
  AccessTokenData access_token_data = 2;  // deprecated
  repeated string text_input_history = 3;
  repeated ImportedModel imported_model = 4;
  bool is_tos_accepted = 5;
  // Field 6 reserved (removed: has_run_tiny_garden)
  reserved 6;
  EchoSenseSettings echosense_settings = 7;
}

message UserData {
  AccessTokenData access_token_data = 1;
}
