name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'EchoSenseiOS/**'
      - '.github/workflows/build_ios.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'EchoSenseiOS/**'
      - '.github/workflows/build_ios.yaml'

jobs:
  build_ios:
    name: Build iOS App
    runs-on: macos-26
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./EchoSenseiOS
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v6
      - name: Install CocoaPods dependencies
        run: pod install --deployment
      - name: Build
        run: >-
          xcodebuild
          -workspace EchoSenseiOS.xcworkspace
          -scheme EchoSenseiOS
          -configuration Debug
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
